# Nodera — static SPA served by nginx.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nodera
#   sudo ln -sf /etc/nginx/sites-available/nodera /etc/nginx/sites-enabled/nodera
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 35.246.59.75 _;

    root /var/www/nodera;
    index index.html;

    # SPA fallback: unknown paths are handled by the client-side app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or deploys will not reach browsers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
